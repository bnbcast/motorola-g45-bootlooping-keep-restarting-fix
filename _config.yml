# GitHub Pages config for moto-g45-bootloop-fix
title: "Moto G45 5G Bootloop Fix — Corrupt Modem NV Repair"
description: "Complete diagnosis, repair guide, and recovery documentation for the Moto G45 5G (XT2363-9, codename fogos) bootloop caused by corrupt modem NV in modemst1/modemst2. Fix: unlock bootloader, fastboot erase modemst1 + modemst2, modem rebuilds NV from golden fsg partition."
author: moto-g45-bootloop-fix
url: "https://moto-g45-bootloop-fix.github.io"
baseurl: ""

# Theme
theme: minima
remote_theme: minima

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# SEO
lang: en
languages: ["en", "id"]

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:name/

# Exclude from build
exclude:
  - scripts/
  - evidence/
  - .git/
  - .github/
  - README.md
  - README.id.md
  - LICENSE
  - PRIVACY.md
  - sitemap.xml
  - robots.txt
  - _config.yml
  - index.html

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "docs"
      type: docs
    values:
      layout: doc

# Social
twitter:
  username: ""
  card: summary_large_image

social:
  name: moto-g45-bootloop-fix
  links:
    - https://github.com/moto-g45-bootloop-fix/moto-g45-bootloop-fix

# Header
header_pages:
  - README.md
  - README.id.md
  - docs/12-confirmed-fix-nv-repair.md
  - docs/05-tutorial.md
  - docs/03-root-cause.md